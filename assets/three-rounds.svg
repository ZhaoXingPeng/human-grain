<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Human Grain three-round loop</title>
  <desc id="desc">Three editorial stages: strip, friction, grain, connected by a thin line.</desc>
  <rect width="1600" height="360" fill="#0d0f0e"/>
  <path d="M84 74H1516" stroke="#2b302c" stroke-width="2"/>
  <text x="84" y="48" fill="#a9afa9" font-family="monospace" font-size="16" letter-spacing="3">THE RUNNING LOOP / EVERY DOCUMENT</text>
  <g transform="translate(84 118)">
    <rect width="420" height="156" fill="#ff6b4a"/>
    <text x="28" y="54" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">01</text>
    <text x="28" y="98" fill="#0d0f0e" font-family="monospace" font-size="21" letter-spacing="2">STRIP</text>
    <text x="28" y="130" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="17">remove the machine sheen</text>
  </g>
  <path d="M550 196H624" stroke="#a9afa9" stroke-width="3"/><path d="m614 184 16 12-16 12" fill="none" stroke="#a9afa9" stroke-width="3"/>
  <g transform="translate(650 118)">
    <rect width="420" height="156" fill="#8fb8ff"/>
    <text x="28" y="54" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">02</text>
    <text x="28" y="98" fill="#0d0f0e" font-family="monospace" font-size="21" letter-spacing="2">FRICTION</text>
    <text x="28" y="130" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="17">let a person show up</text>
  </g>
  <path d="M1116 196H1190" stroke="#a9afa9" stroke-width="3"/><path d="m1180 184 16 12-16 12" fill="none" stroke="#a9afa9" stroke-width="3"/>
  <g transform="translate(1216 118)">
    <rect width="300" height="156" fill="#b8f04a"/>
    <text x="28" y="54" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">03</text>
    <text x="28" y="98" fill="#0d0f0e" font-family="monospace" font-size="21" letter-spacing="2">GRAIN</text>
    <text x="28" y="130" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="17">shape the Markdown</text>
  </g>
</svg>

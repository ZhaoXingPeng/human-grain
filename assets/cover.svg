<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human Grain editorial workspace</title>
  <desc id="desc">A dark editorial workspace with a marked-up Markdown document, status labels, and a bright correction stroke.</desc>
  <rect width="1600" height="900" fill="#0d0f0e"/>
  <path d="M0 116H1600M0 744H1600" stroke="#2b302c" stroke-width="2"/>
  <path d="M118 0V900M1450 0V900" stroke="#2b302c" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="118" y="82" fill="#b8f04a" font-size="22" letter-spacing="5">HG / HUMAN GRAIN / 0.1</text>
    <text x="118" y="202" fill="#f4f1e8" font-size="96" font-weight="700" letter-spacing="-2">HUMAN</text>
    <text x="118" y="296" fill="#f4f1e8" font-size="96" font-weight="700" letter-spacing="-2">GRAIN</text>
    <text x="122" y="352" fill="#a9afa9" font-size="22" letter-spacing="2">A MARKDOWN SKILL FOR TEXT WITH A PULSE.</text>
    <text x="122" y="408" fill="#ff6b4a" font-size="18" letter-spacing="3">STRIP / FRICTION / GRAIN</text>
    <text x="118" y="820" fill="#777f78" font-size="16" letter-spacing="2">WRITTEN, NOT GENERATED</text>
  </g>
  <g transform="translate(720 146) rotate(-3 360 280)">
    <rect width="610" height="500" fill="#f4f1e8"/>
    <rect x="34" y="34" width="542" height="432" fill="none" stroke="#c8c5ba" stroke-width="2"/>
    <text x="62" y="88" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"># 先说背景</text>
    <text x="62" y="132" fill="#424841" font-family="monospace" font-size="17">团队现在不是没有工具。</text>
    <text x="62" y="164" fill="#424841" font-family="monospace" font-size="17">是工具太多了，消息散在各处。</text>
    <rect x="58" y="190" width="438" height="25" fill="#b8f04a" opacity="0.82"/>
    <text x="62" y="210" fill="#0d0f0e" font-family="monospace" font-size="17">先把任务放在一个地方。</text>
    <text x="62" y="270" fill="#0d0f0e" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">## 先记一下</text>
    <text x="78" y="312" fill="#424841" font-family="monospace" font-size="17">- 负责人</text>
    <text x="78" y="346" fill="#424841" font-family="monospace" font-size="17">- 截止时间（先空着）</text>
    <text x="78" y="380" fill="#424841" font-family="monospace" font-size="17">- 还有个没想好的点……</text>
    <path d="M60 420 C190 402 330 438 512 414" fill="none" stroke="#ff6b4a" stroke-width="9" stroke-linecap="round"/>
    <text x="388" y="454" fill="#ff6b4a" font-family="monospace" font-size="15">TODO / keep it human</text>
  </g>
  <g transform="translate(1410 150)">
    <rect width="96" height="30" fill="#b8f04a"/>
    <text x="14" y="21" fill="#0d0f0e" font-family="monospace" font-size="14">3 / 5</text>
    <text x="0" y="70" fill="#777f78" font-family="monospace" font-size="14">ROUGHNESS</text>
    <text x="0" y="108" fill="#f4f1e8" font-family="monospace" font-size="14">typo off</text>
    <text x="0" y="148" fill="#f4f1e8" font-family="monospace" font-size="14">safe fields</text>
  </g>
</svg>

name: validate

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill metadata and scripts
        run: |
          test -f SKILL.md
          grep -q 'name: human-grain-writer' SKILL.md
          grep -q '\$human-grain-writer' agents/openai.yaml
          python3 -m py_compile scripts/validate_markdown.py
          bash scripts/check_skill.sh
      - name: Run strict audit
        run: ./scripts/strict_audit.sh
